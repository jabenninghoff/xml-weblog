services:
  nginx:
    image: nginx:1.31.2-alpine3.23-slim # sha256:dd722b8ee8794f3c273bfaf8b5351b0652a68ccd73c17e5f0d029857a58f25ef
    restart: unless-stopped
    depends_on:
      - php
      - mysql
    ports:
      - $XWL_WEB_PORT:80
    volumes:
      - ./src:/var/lib/nginx/html:ro
      - ./data/assets:/var/lib/nginx/assets:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro

  php:
    # image: ghcr.io/jabenninghoff/xml-weblog:version # uncomment and use with specific version number for production
    image: xml-weblog:dev # use with docker-build.sh for local development, remove for production
    restart: unless-stopped
    volumes:
      - ./src:/var/lib/nginx/html:ro
    environment:
      - MYSQL_PASSWORD=$XWL_MYSQL_PASSWORD

  mysql:
    image: mysql:5.7.44-oraclelinux7 # sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$XWL_MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE=xml_weblog
      - MYSQL_USER=weblog
      - MYSQL_PASSWORD=$XWL_MYSQL_PASSWORD
